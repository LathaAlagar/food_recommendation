{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center flex-grow mt-10">
    <div class="glass-panel max-w-md w-full p-8 rounded-3xl shadow-xl border border-white/20 relative animate-fade-up">
        
        <!-- Tab selector -->
        <div class="flex justify-center space-x-6 mb-8 border-b border-gray-200/40 dark:border-slate-800 pb-4">
            <a href="{{ url_for('auth.login') }}" class="text-lg font-bold text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-400 pb-2">Log In</a>
            <a href="{{ url_for('auth.signup') }}" class="text-lg font-bold text-orange-500 border-b-2 border-orange-500 pb-2">Sign Up</a>
        </div>

        <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-6 text-center">Create Account</h2>

        <!-- Native Register Form -->
        <form action="{{ url_for('auth.signup') }}" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Username</label>
                <input type="text" name="username" id="username" required placeholder="john_doe" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 focus:outline-none focus:border-orange-500 dark:focus:border-orange-400 text-sm">
            </div>

            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="john.doe@gmail.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 focus:outline-none focus:border-orange-500 dark:focus:border-orange-400 text-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Password</label>
                <input type="password" name="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 focus:outline-none focus:border-orange-500 dark:focus:border-orange-400 text-sm">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="terms" required class="h-4 w-4 text-orange-500 focus:ring-orange-400 border-gray-300 rounded">
                <label for="terms" class="ml-2 text-xs text-gray-500 dark:text-gray-400">
                    I agree to the Terms of Service & Privacy Policy.
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 text-sm font-bold text-white bg-gradient-to-r from-orange-500 to-amber-500 rounded-xl hover:opacity-95 shadow-md shadow-orange-500/10 transition-all">
                Create Account
            </button>
        </form>

        <!-- Login Redirect -->
        <p class="mt-6 text-center text-xs text-gray-400">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-orange-500 hover:underline">Log In</a>
        </p>

    </div>
</div>
{% endblock %}
